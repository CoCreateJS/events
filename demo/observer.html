<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Observer Events | CoCreateJS</title>

		<!-- CoCreate Favicon -->
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="../assets/favicon.ico" />

		<!-- Custom CSS -->
		<style type="text/css">
			.test {
				background: red;
			}
			.new {
				background: yellow;
			}
			.active {
				background-color: blue;
			}
			.hidden {
				display: none;
			}
		</style>
		<link rel="manifest" href="/manifest.webmanifest" />
	</head>
	<body>
		<div click-query="$parent" click-value="active">click here</div>
		<div
			observe-query="$parent"
			observe-attribute="class"
			observe-value="active">
			testing this new value
		</div>

		<!--<script src="../dist/CoCreate-events.js"></script>-->
		<script src="https://CoCreateJS.com/dist/CoCreate.js"></script>
	</body>
</html>
